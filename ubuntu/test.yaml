- name: Sync ETCD certificates for kubeadm external mode
  hosts: master
  become: true
  tasks:
    - name: Create ETCD PKI directory
      file:
        path: /etc/kubernetes/pki/etcd
        state: directory
        mode: '0755'

    - name: Sync ETCD certs and keys to Master nodes
      vars:
        # 核心：使用 (索引 % 节点数) | int，确保索引为整数且不会越界
        etcd_target: "{{ groups['etcd'][(groups['master'].index(inventory_hostname) % groups['etcd'] | length) | int] }}"
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        # 全部统一下发到 /etc/kubernetes/pki/etcd/ 目录下
        - { src: "/opt/certs/ca.pem", dest: "/etc/kubernetes/pki/etcd/ca.crt" }
        - { src: "/opt/certs/{{ etcd_target }}/etcd.pem", dest: "/etc/kubernetes/pki/etcd/client.crt" }
        - { src: "/opt/certs/{{ etcd_target }}/etcd-key.pem", dest: "/etc/kubernetes/pki/etcd/client.key" }
