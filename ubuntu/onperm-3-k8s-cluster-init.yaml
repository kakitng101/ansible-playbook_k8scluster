- name: Distribute external etcd credentials to all Kubernetes masters
  hosts: master
  become: true
  gather_facts: false

  tags:
    - k8s_init
    - control_plane_join
    - master_join
    - re-sync

  vars:
    current_etcd_mode: "{{ etcd_mode | default('internal') }}"
    cert_work_dir: "{{ etcd_cert_work_dir | default('/tmp/k8s-etcd-certs') }}"

  tasks:
    - name: Create Kubernetes PKI directory
      ansible.builtin.file:
        path: /etc/kubernetes/pki
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: current_etcd_mode == 'external'

    - name: Distribute external etcd CA certificate
      ansible.builtin.copy:
        src: "{{ cert_work_dir }}/ca.pem"
        dest: /etc/kubernetes/pki/apiserver-etcd-client-ca.crt
        owner: root
        group: root
        mode: "0644"
      when: current_etcd_mode == 'external'

    - name: Distribute external etcd client certificate
      ansible.builtin.copy:
        src: "{{ cert_work_dir }}/cluster.pem"
        dest: /etc/kubernetes/pki/apiserver-etcd-client.crt
        owner: root
        group: root
        mode: "0644"
      when: current_etcd_mode == 'external'

    - name: Distribute external etcd client key
      ansible.builtin.copy:
        src: "{{ cert_work_dir }}/cluster.key"
        dest: /etc/kubernetes/pki/apiserver-etcd-client.key
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: current_etcd_mode == 'external'

- name: Initialize Kubernetes cluster
  hosts: master
  become: true
  gather_facts: false

  tags:
    - k8s_init
    - control_plane_join
    - master_join

  vars:
    current_etcd_mode: "{{ etcd_mode | default('internal') }}"
    vip_address: "{{ kube_vip_address | default('192.168.10.187') }}"
    vip_port: "{{ kube_vip_port | default(6443) }}"
    pod_cidr: "{{ kube_pod_cidr | default('10.244.0.0/16') }}"

    external_etcd_ca_file: /etc/kubernetes/pki/apiserver-etcd-client-ca.crt
    external_etcd_cert_file: /etc/kubernetes/pki/apiserver-etcd-client.crt
    external_etcd_key_file: /etc/kubernetes/pki/apiserver-etcd-client.key

  tasks:
    # 1. 动态获取实际安装的 kubeadm 版本信息
    - name: Get installed kubeadm version
      ansible.builtin.command: kubeadm version -o json
      register: kubeadm_version_raw
      changed_when: false
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 2. 动态提取版本号与对应的 API 规范版本（支持新老版本无缝切换）
    - name: Set dynamic Kubernetes version facts
      ansible.builtin.set_fact:
        detected_k8s_version: "{{ (kubeadm_version_raw.stdout | from_json).clientVersion.gitVersion }}"
        detected_api_version: >-
          {{
            'kubeadm.k8s.io/v1beta4'
            if ((kubeadm_version_raw.stdout | from_json).clientVersion.minor | int) >= 31
            else 'kubeadm.k8s.io/v1beta3'
          }}
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 3. 动态导出原生 kubeadm 默认配置模板
    - name: Generate kubeadm init default configuration
      ansible.builtin.shell: >-
        kubeadm config print init-defaults
        --component-configs KubeletConfiguration
        > /tmp/cluster.yaml
      args:
        executable: /bin/bash
      changed_when: true
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 4. 动态更新配置文件中的 apiVersion (适配 v1beta3 / v1beta4)
    - name: Dynamically update API version in cluster.yaml
      ansible.builtin.replace:
        path: /tmp/cluster.yaml
        regexp: 'apiVersion: kubeadm\.k8s\.io/v1beta[34]'
        replace: "apiVersion: {{ detected_api_version }}"
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 5. 动态更新 kubernetesVersion 为当前节点实际版本
    - name: Dynamically update kubernetesVersion in cluster.yaml
      ansible.builtin.replace:
        path: /tmp/cluster.yaml
        regexp: 'kubernetesVersion: ".*"'
        replace: 'kubernetesVersion: "{{ detected_k8s_version }}"'
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 6. 配置外部 etcd（当 etcd 模式为 external 时）
    - name: Configure external etcd dynamically
      ansible.builtin.replace:
        path: /tmp/cluster.yaml
        regexp: 'etcd:\n\s+local:\n\s+dataDir: /var/lib/etcd'
        replace: |-
          etcd:
            external:
              endpoints:
          {% for host in groups.get('etcd', []) %}
                - "https://{{ hostvars[host].ansible_host | default(host) }}:2379"
          {% endfor %}
              caFile: "{{ external_etcd_ca_file }}"
              certFile: "{{ external_etcd_cert_file }}"
              keyFile: "{{ external_etcd_key_file }}"
      when:
        - current_etcd_mode == 'external'
        - inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 7. 配置 API server 绑定的监听地址
    - name: Configure API server advertise address dynamically
      ansible.builtin.replace:
        path: /tmp/cluster.yaml
        regexp: '^(\s*)advertiseAddress:\s*.*$'
        replace: '\1advertiseAddress: {{ hostvars[inventory_hostname].ansible_host | default(ansible_ssh_host | default(inventory_hostname)) }}'
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 8. 配置初始 control-plane 节点名称
    - name: Configure initial control-plane node name dynamically
      ansible.builtin.replace:
        path: /tmp/cluster.yaml
        regexp: 'name: node'
        replace: "name: {{ inventory_hostname }}"
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 9. 注入高可用 VIP 访问端点
    - name: Configure highly available API server endpoint
      ansible.builtin.lineinfile:
        path: /tmp/cluster.yaml
        insertafter: '^clusterName:'
        line: "controlPlaneEndpoint: {{ vip_address }}:{{ vip_port }}"
        state: present
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 10. 注入 Pod 网络网段
    - name: Configure pod CIDR
      ansible.builtin.lineinfile:
        path: /tmp/cluster.yaml
        insertafter: '^  serviceSubnet:'
        line: "  podSubnet: {{ pod_cidr }}"
        state: present
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    # 11. 执行集群初始化
    - name: Initialize first control-plane node
      ansible.builtin.shell: kubeadm init --config=/tmp/cluster.yaml --upload-certs --skip-phases=addon/kube-proxy
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/admin.conf
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    - name: Create .kube directory for root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    - name: Copy admin.conf to root kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: inventory_hostname == (groups['master'] | first)
      tags:
        - k8s_init

    - name: Generate external etcd control-plane join command
      ansible.builtin.shell: >-
        kubeadm token create --print-join-command
        --certificate-key $(kubeadm init phase upload-certs --upload-certs --config=/tmp/cluster.yaml| tail -n 1)
      register: external_control_plane_join_output
      changed_when: true
      delegate_to: "{{ groups['master'] | first }}"
      run_once: true
      tags:
        - control_plane_join
        - master_join

    - name: Generate worker join command
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - --print-join-command
      register: worker_join_output
      changed_when: true
      no_log: true
      delegate_to: "{{ groups['master'] | first }}"
      run_once: true
      tags:
        - worker_join

- name: Join secondary control-plane nodes
  hosts: "{{ groups['master'][1:] }}"
  become: true
  gather_facts: false
  serial: 1

  tags:
    - control_plane_join
    - master_join

  vars:
    current_etcd_mode: "{{ etcd_mode | default('internal') }}"
    bootstrap_master: "{{ groups['master'] | first }}"

  tasks:
    - name: Clean up legacy K8s PKI on secondary masters (keep external etcd certs)
      ansible.builtin.shell: |
        find /etc/kubernetes/pki -type f ! -name "apiserver-etcd-client*" -exec rm -f {} +
      args:
        executable: /bin/bash
      when: current_etcd_mode == 'external'

    - name: Join control-plane node using external etcd
      ansible.builtin.shell: >-
        {{
          hostvars[bootstrap_master]
          .external_control_plane_join_output.stdout
        }}
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/kubelet.conf
      register: external_master_join_result

- name: Join worker nodes
  hosts: "{{ groups['worker'] | default([]) }}"
  become: true
  gather_facts: false

  tags:
    - worker_join

  vars:
    bootstrap_master: "{{ groups['master'] | first }}"

  tasks:
    - name: Join worker node to the cluster
      ansible.builtin.shell: >-
        {{
          hostvars[bootstrap_master]
          .worker_join_output.stdout
        }}
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/kubelet.conf
      register: worker_join_result
      when: groups['worker'] is defined and inventory_hostname in groups['worker']
